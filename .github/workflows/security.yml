name: Supply Chain Security

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

jobs:
  image-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/supply-chain-demo" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t supply-chain-demo:${{ github.sha }} \
            app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: supply-chain-demo:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: supply-chain-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-sbom
          path: sbom.spdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag \
            supply-chain-demo:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push \
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          cosign sign --yes "$IMAGE"

      - name: Verify container signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/security.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
